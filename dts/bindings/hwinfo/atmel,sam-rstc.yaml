description: ATMEL SAM Reset controller

compatible: "atmel,sam-rstc"

include: base.yaml

properties:
  reg:
    required: true

  clocks:
    description: |
      Peripheral clock of the reset controller, enabled at boot. Omit it where
      the reset controller has no PMC clock gate (PIC32CZ CA70).

  user-nrst:
    type: boolean
    description: Allow user reset on external NRST assert.
